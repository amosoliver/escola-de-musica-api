default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  port: <%= ENV.fetch("DB_PORT", 5432) %>
  pool: <%= ENV.fetch("DB_POOL_SIZE", 5) %>
  username: <%= ENV.fetch("DB_USER", "dev") %>
  password: <%= ENV["DB_PASSWORD"] %>

development:
  <<: *default
  database: <%= ENV.fetch("DB_NAME", "escola_de_musica_api") %>
  prepared_statements: false

test:
  <<: *default
  database: <%= ENV.fetch("DB_TEST_NAME", "escola_de_musica_api_test") %>

production:
  <<: *default
  database: <%= ENV.fetch("DB_PRODUCTION_NAME", "escola_de_musica_api_production") %>

<% if ENV["DW_DATABASE"].present? %>
sqlserver:
  adapter: sqlserver
  host: <%= ENV.fetch("DW_HOST", "localhost") %>
  port: <%= ENV.fetch("DW_PORT", 1433) %>
  database: <%= ENV.fetch("DW_DATABASE", "DW") %>
  username: <%= ENV.fetch("DW_USERNAME", "sa") %>
  password: <%= ENV.fetch("DW_PASSWORD", "123456") %>
  timeout: 1000000
<% end %>
